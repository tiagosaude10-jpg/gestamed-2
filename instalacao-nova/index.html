<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>GestaMed</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="GestaMed">
  <meta name="application-name" content="GestaMed">
  <meta name="theme-color" content="#f74f93">
  <link rel="manifest" href="manifest.json?v=1">
  <link rel="apple-touch-icon" sizes="180x180" href="gestamed-rosa-v1.png?v=1">
  <link rel="icon" type="image/png" href="gestamed-rosa-v1.png?v=1">
  <style>
    *{box-sizing:border-box} body{margin:0;min-height:100vh;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:linear-gradient(180deg,#fff7fb,#ffe5f0);display:grid;place-items:center;color:#3b1730}.card{width:min(92vw,430px);padding:32px 24px;border-radius:30px;background:#fff;box-shadow:0 18px 50px rgba(189,44,111,.18);text-align:center}.logo{width:150px;height:150px;border-radius:32px;display:block;margin:0 auto 18px}.title{font-size:34px;font-weight:800;margin:0}.subtitle{font-size:17px;line-height:1.45;margin:10px 0 0;color:#74576a}.note{margin-top:24px;padding:14px;border-radius:16px;background:#fff0f6;font-size:15px;line-height:1.4}</style>
</head>
<body>
  <main class="card">
    <img class="logo" src="gestamed-rosa-v1.png?v=1" alt="Ícone rosa do GestaMed">
    <h1 class="title">GestaMed</h1>
    <p class="subtitle">Versão nova com identidade rosa.</p>
    <div class="note">Use Compartilhar → Adicionar à Tela de Início.</div>
  </main>
  <script>
    const standalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
    if (standalone) location.replace('../index.html?origem=instalacao-nova-v1');
  </script>
</body>
</html>
