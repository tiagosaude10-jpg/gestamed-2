name: Configurar autenticacao GestaMed

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/configure-supabase-auth.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: configure-supabase-auth
  cancel-in-progress: false

jobs:
  configure:
    name: Atualizar e verificar Supabase Auth
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: ptyhmvkuedgudhlvcxo
      SITE_URL: https://tiagosaude10-jpg.github.io/gestamed-2/
      REDIRECT_URL: https://tiagosaude10-jpg.github.io/gestamed-2/**

    steps:
      - name: Validar segredo
        shell: bash
        run: |
          set -Eeuo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "O segredo SUPABASE_ACCESS_TOKEN nao foi encontrado."
            exit 1
          fi

      - name: Atualizar URLs e modelos de e-mail
        shell: bash
        run: |
          set -Eeuo pipefail

          confirmation_html=$(cat <<'HTML'
          <div style="max-width:560px;margin:0 auto;padding:32px;font-family:Arial,sans-serif;background:#fff7fa;border-radius:24px;color:#572238;text-align:center;">
            <h1 style="color:#cf1754;">Bem-vindo ao GestaMed</h1>
            <p style="font-size:16px;line-height:1.6;">Recebemos sua solicitação de cadastro.</p>
            <p style="font-size:16px;line-height:1.6;">Clique no botão abaixo para confirmar seu endereço de e-mail.</p>
            <p style="margin:28px 0;"><a href="{{ .ConfirmationURL }}" style="display:inline-block;padding:15px 28px;border-radius:16px;background:#e91e63;color:#ffffff;text-decoration:none;font-size:16px;font-weight:bold;">Confirmar meu e-mail</a></p>
            <p style="font-size:14px;line-height:1.6;color:#765466;">Depois da confirmação, seu cadastro será analisado pela administração do GestaMed.</p>
            <p style="font-size:13px;color:#967386;margin-top:28px;">Se você não solicitou este cadastro, ignore esta mensagem.</p>
          </div>
          HTML
          )

          recovery_html=$(cat <<'HTML'
          <div style="max-width:560px;margin:0 auto;padding:32px;font-family:Arial,sans-serif;background:#fff7fa;border-radius:24px;color:#572238;text-align:center;">
            <h1 style="color:#cf1754;">Recuperação de senha</h1>
            <p style="font-size:16px;line-height:1.6;">Recebemos uma solicitação para alterar a senha da sua conta no GestaMed.</p>
            <p style="margin:28px 0;"><a href="{{ .ConfirmationURL }}" style="display:inline-block;padding:15px 28px;border-radius:16px;background:#e91e63;color:#ffffff;text-decoration:none;font-size:16px;font-weight:bold;">Criar nova senha</a></p>
            <p style="font-size:13px;line-height:1.6;color:#967386;">Se você não solicitou esta alteração, ignore esta mensagem. Sua senha permanecerá a mesma.</p>
          </div>
          HTML
          )

          payload=$(jq -n \
            --arg site_url "$SITE_URL" \
            --arg uri_allow_list "$REDIRECT_URL" \
            --arg confirmation_subject "Confirme seu cadastro no GestaMed" \
            --arg confirmation_content "$confirmation_html" \
            --arg recovery_subject "Crie uma nova senha para o GestaMed" \
            --arg recovery_content "$recovery_html" \
            '{
              site_url: $site_url,
              uri_allow_list: $uri_allow_list,
              mailer_subjects_confirmation: $confirmation_subject,
              mailer_templates_confirmation_content: $confirmation_content,
              mailer_subjects_recovery: $recovery_subject,
              mailer_templates_recovery_content: $recovery_content
            }')

          response_file=$(mktemp)
          http_status=$(curl --silent --show-error \
            --output "$response_file" \
            --write-out "%{http_code}" \
            --request PATCH \
            --url "https://api.supabase.com/v1/projects/${PROJECT_REF}/config/auth" \
            --header "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            --header "Content-Type: application/json" \
            --data "$payload")

          if [[ ! "$http_status" =~ ^2 ]]; then
            echo "O Supabase recusou a atualização (HTTP ${http_status})."
            jq -r 'if type == "object" then (.message // .error // .) else . end' "$response_file"
            exit 1
          fi

          rm -f "$response_file"

      - name: Verificar configuracao aplicada
        shell: bash
        run: |
          set -Eeuo pipefail

          response=$(curl --fail-with-body --silent --show-error \
            --url "https://api.supabase.com/v1/projects/${PROJECT_REF}/config/auth" \
            --header "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}")

          jq -e \
            --arg site_url "$SITE_URL" \
            --arg uri_allow_list "$REDIRECT_URL" \
            --arg confirmation_subject "Confirme seu cadastro no GestaMed" \
            --arg recovery_subject "Crie uma nova senha para o GestaMed" \
            '
              .site_url == $site_url and
              .uri_allow_list == $uri_allow_list and
              .mailer_subjects_confirmation == $confirmation_subject and
              .mailer_subjects_recovery == $recovery_subject and
              (.mailer_templates_confirmation_content | contains("Confirmar meu e-mail")) and
              (.mailer_templates_recovery_content | contains("Criar nova senha"))
            ' <<<"$response" >/dev/null

          echo "Configuracao do Supabase Auth verificada com sucesso."
