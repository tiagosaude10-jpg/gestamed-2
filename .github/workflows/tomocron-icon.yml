name: Aplicar ícone final TomoCron

on:
  push:
    paths:
      - '.github/workflows/tomocron-icon.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-icon:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Integrar Tela de Comando v30
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tomocron/index.html')
          s=p.read_text()
          css='<link rel="stylesheet" href="./command-v28.css?v=28">'
          css30='<link rel="stylesheet" href="./command-main-v30.css?v=30">'
          js='<script src="./command-v28.js?v=28" defer></script>'
          if css not in s:
              s=s.replace('<link rel="stylesheet" href="./app.css?v=27">', '<link rel="stylesheet" href="./app.css?v=27">\n'+css)
          if css30 not in s:
              s=s.replace(css, css+'\n'+css30)
          if js not in s:
              s=s.replace('<script src="./app.js?v=27" defer></script>', '<script src="./app.js?v=27" defer></script>\n'+js)
          p.write_text(s)
          PY

      - name: Validar JavaScript da Tela de Comando
        shell: bash
        run: |
          set -euo pipefail
          node --check tomocron/command-v28.js

      - name: Decodificar ícone aprovado
        shell: bash
        run: |
          set -euo pipefail
          base64 -d tomocron/icon-red-approved-180.b64 > tomocron/icon-180.png
          cp tomocron/icon-180.png tomocron/icon-192.png
          cp tomocron/icon-180.png tomocron/icon-512.png
          cp tomocron/icon-180.png tomocron/icon-maskable-512.png

      - name: Atualizar manifest e cache
        shell: bash
        run: |
          cat > tomocron/manifest.webmanifest <<'EOF'
          {
            "name": "TomoCron — Tomografia com Contraste",
            "short_name": "TomoCron",
            "id": "./",
            "start_url": "./",
            "scope": "./",
            "display": "standalone",
            "orientation": "portrait",
            "background_color": "#8b0b0b",
            "theme_color": "#8b0b0b",
            "icons": [
              {"src":"./icon-180.png","sizes":"180x180","type":"image/png","purpose":"any"},
              {"src":"./icon-192.png","sizes":"180x180","type":"image/png","purpose":"any"}
            ]
          }
          EOF
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tomocron/sw.js')
          s=p.read_text()
          import re
          s=re.sub(r"const CACHE='[^']+';", "const CACHE='tomocron-v30-main-buttons-spacing-2026-08-21';", s)
          s=s.replace("'./icon-512.svg','./icon-maskable-512.svg'", "'./icon-512.png','./icon-maskable-512.png'")
          if "'./command-v28.css?v=28'" not in s:
              s=s.replace("'./app.css?v=27','./app.js?v=27'", "'./app.css?v=27','./app.js?v=27','./command-v28.css?v=28','./command-v28.js?v=28'")
          if "'./command-main-v30.css?v=30'" not in s:
              s=s.replace("'./command-v28.js?v=28'", "'./command-v28.js?v=28','./command-main-v30.css?v=30'")
          p.write_text(s)
          PY

      - name: Commitar atualização TomoCron
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tomocron/index.html tomocron/icon-180.png tomocron/icon-192.png tomocron/icon-512.png tomocron/icon-maskable-512.png tomocron/manifest.webmanifest tomocron/sw.js
          if git diff --cached --quiet; then
            echo "Nada para atualizar"
            exit 0
          fi
          git commit -m "Aplicar espaçamento v30 da tela principal do TomoCron"
          git push
