name: Aplicar ícone final TomoCron

on:
  push:
    paths:
      - '.github/workflows/tomocron-icon.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-icon:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Integrar etapa 1 verificada da pesquisa
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tomocron/index.html')
          s=p.read_text()
          css28='<link rel="stylesheet" href="./command-v28.css?v=28">'
          css32='<link rel="stylesheet" href="./command-main-v32.css?v=33">'
          css34='<link rel="stylesheet" href="./command-search-v34.css?v=34">'
          js28='<script src="./command-v28.js?v=28" defer></script>'
          js35='<script src="./command-search-runtime-v35.js?v=35" defer></script>'
          if css28 not in s:
              s=s.replace('<link rel="stylesheet" href="./app.css?v=27">', '<link rel="stylesheet" href="./app.css?v=27">\n'+css28)
          if css32 not in s:
              s=s.replace(css28, css28+'\n'+css32)
          if css34 not in s:
              s=s.replace(css32, css32+'\n'+css34)
          if js28 not in s:
              s=s.replace('<script src="./app.js?v=27" defer></script>', '<script src="./app.js?v=27" defer></script>\n'+js28)
          if js35 not in s:
              s=s.replace(js28, js28+'\n'+js35)
          p.write_text(s)
          PY

      - name: Atualizar controlador real de cache do projeto
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('service-worker.js')
          s=p.read_text()
          s=re.sub(r"const GESTAMED_BUILD = '[^']+';", "const GESTAMED_BUILD = '2026.08.21.342';", s)
          p.write_text(s)
          PY

      - name: Validar JavaScript da Tela de Comando
        shell: bash
        run: |
          set -euo pipefail
          node --check tomocron/command-v28.js
          node --check tomocron/command-search-runtime-v35.js

      - name: Decodificar ícone aprovado
        shell: bash
        run: |
          set -euo pipefail
          base64 -d tomocron/icon-red-approved-180.b64 > tomocron/icon-180.png
          cp tomocron/icon-180.png tomocron/icon-192.png
          cp tomocron/icon-180.png tomocron/icon-512.png
          cp tomocron/icon-180.png tomocron/icon-maskable-512.png

      - name: Atualizar manifest e cache secundário do TomoCron
        shell: bash
        run: |
          cat > tomocron/manifest.webmanifest <<'EOF'
          {
            "name": "TomoCron — Tomografia com Contraste",
            "short_name": "TomoCron",
            "id": "./",
            "start_url": "./",
            "scope": "./",
            "display": "standalone",
            "orientation": "portrait",
            "background_color": "#8b0b0b",
            "theme_color": "#8b0b0b",
            "icons": [
              {"src":"./icon-180.png","sizes":"180x180","type":"image/png","purpose":"any"},
              {"src":"./icon-192.png","sizes":"180x180","type":"image/png","purpose":"any"}
            ]
          }
          EOF
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('tomocron/sw.js')
          s=p.read_text()
          s=re.sub(r"const CACHE='[^']+';", "const CACHE='tomocron-v35-stage1-search-runtime-2026-08-21';", s)
          if "'./command-search-v34.css?v=34'" not in s:
              s=s.replace("'./command-main-v32.css?v=33'", "'./command-main-v32.css?v=33','./command-search-v34.css?v=34'")
          if "'./command-search-runtime-v35.js?v=35'" not in s:
              s=s.replace("'./command-v28.js?v=28'", "'./command-v28.js?v=28','./command-search-runtime-v35.js?v=35'")
          p.write_text(s)
          PY

      - name: Conferir integração antes do commit
        shell: bash
        run: |
          set -euo pipefail
          grep -F './command-main-v32.css?v=33' tomocron/index.html
          grep -F './command-search-v34.css?v=34' tomocron/index.html
          grep -F './command-search-runtime-v35.js?v=35' tomocron/index.html
          grep -F "const GESTAMED_BUILD = '2026.08.21.342';" service-worker.js
          grep -F "style.setProperty(prop,val,'important')" tomocron/command-search-runtime-v35.js
          test -s tomocron/command-search-v34.css
          test -s tomocron/command-search-runtime-v35.js

      - name: Commitar atualização TomoCron
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tomocron/index.html tomocron/command-search-v34.css tomocron/command-search-runtime-v35.js tomocron/icon-180.png tomocron/icon-192.png tomocron/icon-512.png tomocron/icon-maskable-512.png tomocron/manifest.webmanifest tomocron/sw.js service-worker.js
          if git diff --cached --quiet; then
            echo "Nada para atualizar"
            exit 0
          fi
          git commit -m "Aplicar correção runtime v35 da pesquisa do TomoCron"
          git push
